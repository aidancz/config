[colours]

text = white black false
stat_indic_mode = white black false
stat_indic_name = white black false
stat_indic_loc = white black false

[keys]

down  = j
up    = k
right = key_right
left  = key_left

pgdn = f
pgup = d
end  = g
home = s

open        = l LF
open_whatis = W
index       = h

fwrd    = o
back    = w
history = H

toc = HT

search      = /
search_back = ?
search_next = n
search_prev = b

help = BS ; ctrl-h
quit = F1
