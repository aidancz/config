style = "full"
enter_accept = true
inline_height = 0
show_numeric_shortcuts = true
show_preview       = true # in the future this setting will be moved to the [preview] section below
max_preview_height = 4    # in the future this setting will be moved to the [preview] section below

[search]

[stats]

[sync]
records = true

[dotfiles]
enabled = false

# [keys]
# scroll_exits = false

[keymap.emacs]
"f1"     = "exit"
"down"   = "select-next"
"up"     = "select-previous"
"right"  = "cursor-right"
"left"   = "cursor-left"
"ctrl-x" = "enter-prefix-mode"
"ctrl-a" = "cursor-start"

[preview]
strategy = "fixed"

[daemon]

[theme]
name = "my-theme"
