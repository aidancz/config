# https://github.com/jesseduffield/lazygit/tree/master/docs

gui:
  scrollHeight: 8
  scrollPastBottom: false
  scrollOffMargin: 0
  sidePanelWidth: 0.3333
  expandFocusedSidePanel: false
  expandedSidePanelWeight: 2
  border: bold
  theme:
    activeBorderColor:
      - blue
    inactiveBorderColor:
      - white
    searchingActiveBorderColor:
      - yellow
    selectedLineBgColor:
      - reverse
    inactiveViewSelectedLineBgColor:
      - underline
  nerdFontsVersion: ""
  screenMode: normal

git:
  autoRefresh: true
  autoDetectExternalChanges: true
  diffRenderers:
    - colorArg: always
      command: diff-so-fancy
      useConfig: false
  log:
    showWholeGraph: false
    # https://github.com/jesseduffield/lazygit/issues/5224

refresher:
  refreshInterval: 10
  externalChangeCheckInterval: 2

quitOnTopLevelReturn: false

customCommands:
  - key: C
    context: files
    command: git commit --allow-empty --allow-empty-message -m ""
  - key: <c-d>
    context: files
    command: git diff {{.SelectedPath}}
    output: terminal

notARepository: quit

promptToReturnFromSubprocess: false

keybinding:

  # https://github.com/jesseduffield/lazygit/issues/5672

  universal:

    prevBlock-alt: <disabled>

    quit: <f1>
    togglePanel: <f3> # switch focus between the panes on the right
    optionMenu: <f2>
    nextItem: j
    prevItem: k
    goInto: l
    return: [h, <esc>]
    nextPage: f
    prevPage: d
    gotoBottom: g
    gotoTop: s
    startSearch: /
    nextMatch: n
    prevMatch: b
    nextBlock: i
    prevBlock: e
    scrollDownMain: <c-j> # https://github.com/jesseduffield/lazygit/issues/1707
    scrollUpMain: <c-k>

    remove: <disabled>
    edit: <disabled>

  files:

    viewResetOptions: "D"

    commitChangesWithEditor: <disabled>
    ignoreFile: <disabled>

  branches:

    viewGitFlowOptions: <disabled>

  commits:

    viewResetOptions: <c-e>

    startInteractiveRebase: <disabled>
    moveDownCommit: <disabled>
    moveUpCommit: <disabled>

  stash:

    popStash: p

  main:

    prevHunk: <disabled>
    nextHunk: <disabled>

  submodules:

    init: <disabled>
